name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0"

      - name: Test, lint, and assemble
        run: bash ./gradlew test lint assembleDebug --no-daemon --console=plain

      - name: Verify v0 guardrails
        shell: pwsh
        run: ./scripts/verify-v0-guardrails.ps1
